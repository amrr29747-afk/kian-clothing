<!DOCTYPE html>
<html lang="en" dir="ltr" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KIAN CLOTHING</title>
    <meta name="description" content="KIAN CLOTHING - Premium streetwear hoodies. Order directly via WhatsApp." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="google" content="notranslate" />
    <meta name="theme-color" content="#000000" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Montserrat', 'Cairo', sans-serif;
      }
      @keyframes blurZoom {
        0% { opacity: 0; transform: scale(0.96); filter: blur(6px); }
        100% { opacity: 1; transform: scale(1); filter: blur(0px); }
      }
      @keyframes slideUp {
        0% { opacity: 0; transform: translateY(15px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      .animate-blur-zoom { animation: blurZoom 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      .animate-slide-up { animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
  </head>
  <body class="bg-black text-white antialiased selection:bg-white selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
