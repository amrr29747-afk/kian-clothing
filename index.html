<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KIAN CLOTHING | كِيان</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; }
    .fade-in { animation: fadeIn 0.4s ease-out forwards; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-black text-white min-h-screen flex flex-col justify-between selection:bg-white selection:text-black">
  
  <!-- Header -->
  <header class="sticky top-0 z-40 bg-black/90 backdrop-blur-md border-b border-zinc-800">
    <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
      <div class="flex items-center space-x-4 rtl:space-x-reverse">
         <span class="text-xs tracking-widest text-zinc-500 font-mono hidden sm:inline">STREETWEAR</span>
      </div>
      <div onclick="showHome()" class="cursor-pointer flex items-center space-x-3 rtl:space-x-reverse">
        <div class="w-9 h-9 rounded-full border border-zinc-700 flex items-center justify-center bg-zinc-900">
          <span class="font-extrabold text-lg text-white">K</span>
        </div>
        <span class="font-black text-2xl tracking-widest text-white uppercase">KIAN</span>
      </div>
      <button onclick="toggleCart(true)" class="relative p-2 text-white hover:opacity-70">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
        <span id="cartBadge" class="hidden absolute -top-1 -right-1 bg-white text-black font-bold text-xs w-5 h-5 rounded-full flex items-center justify-center">0</span>
      </button>
    </div>
  </header>
  
  <!-- Main Content -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-8">
    
    <!-- Products Grid (Home) -->
    <div id="homeView" class="fade-in">
      <div class="flex justify-between items-end mb-8 pb-4 border-b border-zinc-800">
        <div>
          <h1 class="text-4xl font-black uppercase">Products</h1>
          <p class="text-zinc-400 text-sm mt-1">تشكيلة الستريت وير الجديدة لـ KIAN</p>
        </div>
        <span class="text-sm text-zinc-500 font-mono">6 Items</span>
      </div>
      <div id="productsGrid" class="grid grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-8"></div>
    </div>

    <!-- Product Details -->
    <div id="detailView" class="hidden fade-in max-w-5xl mx-auto">
      <button onclick="showHome()" class="flex items-center space-x-2 rtl:space-x-reverse text-zinc-400 hover:text-white mb-6 font-medium text-sm">
        <span>&rarr; الرجوع للمتجر</span>
      </button>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <div class="aspect-[3/4] rounded-2xl overflow-hidden bg-zinc-900 border border-zinc-800">
          <img id="detailImg" class="w-full h-full object-cover" src="" alt="" />
        </div>
        <div class="flex flex-col space-y-6">
          <div>
            <span id="detailCat" class="text-xs uppercase tracking-widest text-zinc-500 font-bold"></span>
            <h1 id="detailName" class="text-3xl font-black mt-1 text-white"></h1>
            <p id="detailPrice" class="text-2xl font-mono font-bold mt-2 text-white"></p>
          </div>
          <div class="border-t border-zinc-800 pt-6">
            <label class="text-sm font-bold text-zinc-300 block mb-3">المقاس (Size):</label>
            <div id="sizeButtons" class="flex flex-wrap gap-3"></div>
          </div>
          <div class="space-y-3 pt-4">
            <button onclick="addSelectedToCart()" class="w-full bg-white text-black hover:bg-zinc-200 py-4 rounded-xl font-black text-base uppercase transition-transform active:scale-95">Add to Cart</button>
            <a id="detailWaBtn" href="#" target="_blank" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-4 rounded-xl font-bold text-base flex justify-center items-center gap-2 transition-transform active:scale-95">
              اطلب الآن عبر واتساب
            </a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Cart Modal -->
  <div id="cartModal" class="hidden fixed inset-0 z-50 overflow-hidden">
    <div onclick="toggleCart(false)" class="absolute inset-0 bg-black/80 backdrop-blur-sm"></div>
    <div class="fixed inset-y-0 right-0 w-full max-w-md bg-zinc-950 border-l border-zinc-800 text-white p-6 flex flex-col shadow-2xl transition-transform">
      <div class="flex items-center justify-between pb-6 border-b border-zinc-800">
        <h2 class="text-xl font-black uppercase">سلة المشتريات</h2>
        <button onclick="toggleCart(false)" class="text-zinc-400 hover:text-white text-2xl">&times;</button>
      </div>
      <div id="cartItemsList" class="flex-1 overflow-y-auto py-4 space-y-4"></div>
      <div id="cartFooter" class="border-t border-zinc-800 pt-6 space-y-4 hidden">
        <div class="flex justify-between items-center text-lg font-black font-mono">
          <span>الإجمالي:</span>
          <span id="cartTotalText">0 EGP</span>
        </div>
        <a id="cartWaBtn" href="#" target="_blank" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-4 rounded-xl font-bold text-base flex justify-center items-center gap-2">
          إتمام الطلب عبر واتساب
        </a>
      </div>
    </div>
  </div>

  <script>
    const PHONE = "201557857558";
    const PRODUCTS = [
      { id: 1, name: "11:11 - Escape to The Moon Hoodie", price: 900, category: "Hoodies", image: "https://images.unsplash.com/photo-1556905055-8f358a7a47b2?w=800&auto=format&fit=crop&q=60" },
      { id: 2, name: "Billie Eilish Oversized Hoodie", price: 850, category: "Hoodies", image: "https://images.unsplash.com/photo-1578632767115-351597cf2477?w=800&auto=format&fit=crop&q=60" },
      { id: 3, name: "BUBBLES HOODIE - Stronger", price: 850, category: "Hoodies", image: "https://images.unsplash.com/photo-1509967419530-da38b4704bc6?w=800&auto=format&fit=crop&q=60" },
      { id: 4, name: "ETHNIC Burgundy Hoodie", price: 900, category: "Hoodies", image: "https://images.unsplash.com/photo-1513782192234-580d437b6798?w=800&auto=format&fit=crop&q=60" },
      { id: 5, name: "Plain Premium Everyday Hoodie", price: 700, category: "Basic", image: "https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=800&auto=format&fit=crop&q=60" },
      { id: 6, name: "BATMAN Minimalist Hoodie", price: 1200, category: "Limited Edition", image: "https://images.unsplash.com/photo-1618354691373-d851c5c3a990?w=800&auto=format&fit=crop&q=60" }
    ];

    let cart = [];
    let activeProduct = null;
    let selectedSize = "L";

    try {
      const saved = localStorage.getItem('kian_cart_vanilla');
      if (saved) cart = JSON.parse(saved);
    } catch(e){}

    function renderProducts() {
      const grid = document.getElementById('productsGrid');
      grid.innerHTML = PRODUCTS.map(p => `
        <div onclick="openProduct(${p.id})" class="cursor-pointer bg-zinc-950 border border-zinc-900 rounded-xl overflow-hidden hover:border-zinc-700 transition-all group">
          <div class="aspect-[3/4] bg-zinc-900 overflow-hidden">
            <img src="${p.image}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"/>
          </div>
          <div class="p-4">
            <h3 class="font-bold text-sm text-zinc-100 truncate">${p.name}</h3>
            <p class="font-black text-sm text-white font-mono mt-2">LE ${p.price} EGP</p>
          </div>
        </div>
      `).join('');
    }

    function openProduct(id) {
      activeProduct = PRODUCTS.find(p => p.id === id);
      selectedSize = "L";
      document.getElementById('detailImg').src = activeProduct.image;
      document.getElementById('detailName').innerText = activeProduct.name;
      document.getElementById('detailCat').innerText = activeProduct.category;
      document.getElementById('detailPrice').innerText = `LE ${activeProduct.price} EGP`;
      
      renderSizes();
      updateDetailWa();
      
      document.getElementById('homeView').classList.add('hidden');
      document.getElementById('detailView').classList.remove('hidden');
      window.scrollTo(0,0);
    }

    function renderSizes() {
      const sizes = ["S", "M", "L", "XL", "2XL"];
      document.getElementById('sizeButtons').innerHTML = sizes.map(s => `
        <button onclick="setSize('${s}')" class="px-5 py-3 rounded-lg border font-bold text-sm ${selectedSize === s ? 'bg-white text-black border-white' : 'bg-zinc-900 text-zinc-300 border-zinc-800'}">${s}</button>
      `).join('');
    }

    function setSize(s) {
      selectedSize = s;
      renderSizes();
      updateDetailWa();
    }

    function updateDetailWa() {
      const msg = encodeURIComponent(`أهلاً KIAN Clothing، حابب أطلب المنتج ده:\n\n- *اسم المنتج:* ${activeProduct.name}\n- *المقاس:* ${selectedSize}\n- *السعر:* ${activeProduct.price} LE\n\nبرجاء تأكيد التوفر!`);
      document.getElementById('detailWaBtn').href = `https://wa.me/${PHONE}?text=${msg}`;
    }

    function showHome() {
      document.getElementById('detailView').classList.add('hidden');
      document.getElementById('homeView').classList.remove('hidden');
      window.scrollTo(0,0);
    }

    function addSelectedToCart() {
      const existing = cart.find(item => item.id === activeProduct.id && item.size === selectedSize);
      if (existing) existing.quantity += 1;
      else cart.push({ ...activeProduct, size: selectedSize, quantity: 1 });
      saveCart();
      toggleCart(true);
    }

    function updateQty(id, size, delta) {
      const item = cart.find(i => i.id === id && i.size === size);
      if (item) {
        item.quantity += delta;
        if (item.quantity <= 0) cart = cart.filter(i => !(i.id === id && i.size === size));
      }
      saveCart();
      renderCart();
    }

    function saveCart() {
      try { localStorage.setItem('kian_cart_vanilla', JSON.stringify(cart)); } catch(e){}
      const totalQty = cart.reduce((sum, item) => sum + item.quantity, 0);
      const badge = document.getElementById('cartBadge');
      if (totalQty > 0) {
        badge.innerText = totalQty;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    }

    function toggleCart(show) {
      const modal = document.getElementById('cartModal');
      if (show) {
        renderCart();
        modal.classList.remove('hidden');
      } else {
        modal.classList.add('hidden');
      }
    }

    function renderCart() {
      const list = document.getElementById('cartItemsList');
      const footer = document.getElementById('cartFooter');
      if (cart.length === 0) {
        list.innerHTML = `<p class="text-zinc-500 text-center py-10">سلة المشتريات فارغة.</p>`;
        footer.classList.add('hidden');
        return;
      }

      let total = 0;
      let waMsgText = "أهلاً KIAN Clothing، حابب أطلب الطلب التالي:\n\n";

      list.innerHTML = cart.map((item, index) => {
        const itemTotal = item.price * item.quantity;
        total += itemTotal;
        waMsgText += `${index + 1}. *${item.name}*\n- المقاس: ${item.size}\n- العدد: ${item.quantity}\n- السعر: ${itemTotal} LE\n\n`;
        return `
          <div class="flex items-center gap-4 bg-zinc-900 p-3 rounded-xl border border-zinc-800">
            <img src="${item.image}" class="w-16 h-20 object-cover rounded-lg" />
            <div class="flex-1">
              <h4 class="font-bold text-sm text-white line-clamp-1">${item.name}</h4>
              <p class="text-xs text-zinc-400 mt-1">المقاس: ${item.size}</p>
              <p class="text-sm font-bold font-mono text-white mt-1">LE ${itemTotal}</p>
            </div>
            <div class="flex items-center gap-2 bg-black border border-zinc-700 rounded-lg p-1">
              <button onclick="updateQty(${item.id}, '${item.size}', -1)" class="px-2 text-zinc-400 font-bold">-</button>
              <span class="text-xs font-bold">${item.quantity}</span>
              <button onclick="updateQty(${item.id}, '${item.size}', 1)" class="px-2 text-zinc-400 font-bold">+</button>
            </div>
          </div>
        `;
      }).join('');

      waMsgText += `*الإجمالي:* ${total} LE\n\nبرجاء تأكيد الطلب وتحديد بيانات الشحن!`;
      document.getElementById('cartTotalText').innerText = `LE ${total} EGP`;
      document.getElementById('cartWaBtn').href = `https://wa.me/${PHONE}?text=${encodeURIComponent(waMsgText)}`;
      footer.classList.remove('hidden');
    }

    // Initialize immediately
    renderProducts();
    saveCart();
  </script>
</body>
</html>
